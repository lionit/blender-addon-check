name: Refresh the top-extensions list

on:
  schedule:
    - cron: "0 1 * * 1"   # Mondays 01:00 UTC
  workflow_dispatch:
    inputs:
      top:
        description: "How many add-ons to keep"
        required: false
        default: "60"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: python scripts/collect_extensions.py --top "${{ github.event.inputs.top || '60' }}"
      - name: Commit
        run: |
          git config user.name "blender-addon-check bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/addons.generated.json
          git diff --cached --quiet && echo "no changes" || git commit -m "Refresh top extensions list [skip ci]"
          git push
